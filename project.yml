# XcodeGen spec for the Handsfree app. `scripts/build_app.sh` turns this into
# Handsfree.xcodeproj, so nobody hand-edits a project file.
#
# Local packages: HFCore is always linked. The other packages under Packages/
# are linked only when they are listed in Handsfree/LinkedPackages.txt, exist,
# and compile. The build script writes that list into
# build/generated/linked-packages.yml, which is included below; XcodeGen
# appends its `packages` and `dependencies` to the ones here.
name: Handsfree

include:
  - path: build/generated/linked-packages.yml
    relativePaths: false

options:
  bundleIdPrefix: com.handsfree
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES

packages:
  HFCore:
    path: Packages/HFCore

targets:
  Handsfree:
    type: application
    platform: macOS
    sources:
      - path: Handsfree
        excludes:
          - "LinkedPackages.txt"
    dependencies:
      - package: HFCore
    info:
      path: Handsfree/Info.plist
      properties:
        CFBundleDisplayName: Handsfree
        CFBundleName: Handsfree
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        # Menu bar only: no Dock icon, no app menu.
        LSUIElement: true
        NSHumanReadableCopyright: "Handsfree. Contains code adapted from Clicky (MIT, Farza)."
        NSMicrophoneUsageDescription: "Handsfree listens for its wake phrase on this Mac, then hears what you ask it to do. Nothing is recorded to disk."
        # The wake phrase is recognised on the Mac itself; no audio leaves it while Handsfree is asleep.
        NSSpeechRecognitionUsageDescription: "Handsfree recognises its wake phrase on this Mac, so nothing you say leaves the Mac until you say it."
        NSScreenCaptureUsageDescription: "Handsfree looks at your screen so it can find the button or field it is about to use for you."
    entitlements:
      path: Handsfree/Handsfree.entitlements
      properties:
        # Posting pointer and key events and reading the accessibility tree are
        # impossible inside the sandbox.
        com.apple.security.app-sandbox: false
        # Required by the hardened runtime for microphone input.
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_NAME: Handsfree
        PRODUCT_BUNDLE_IDENTIFIER: com.handsfree.Handsfree
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        # Signing is chosen by scripts/build_app.sh (a stable Apple Development
        # identity, so macOS keeps the permission grants across rebuilds).
        # These defaults only apply when building inside Xcode by hand.
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: NO

  HandsfreeTests:
    type: bundle.unit-test
    platform: macOS
    # Not hosted in the app: the tests compile the pure logic files directly,
    # so running them never puts an overlay on the screen.
    sources:
      - path: HandsfreeTests
      - path: Handsfree/Companion/CompanionState.swift
      - path: Handsfree/Companion/OverlayGeometry.swift
      - path: Handsfree/Panel/SessionLog.swift
      - path: Handsfree/Setup/SetupCheck.swift
      - path: Handsfree/Demo/DemoScript.swift
      - path: Handsfree/App/LaunchOptions.swift
      - path: Handsfree/App/SingleInstance.swift
      - path: Handsfree/Companion/SoundCues.swift
      - path: Handsfree/Integration/Parts.swift
      - path: Handsfree/Integration/CycleWiring.swift
      - path: Handsfree/Integration/ListeningStatus.swift
      - path: Handsfree/Integration/SleepPhrases.swift
      - path: Handsfree/Integration/ScreenLock.swift
      - path: Handsfree/Panel/PanelSnapshot.swift
      - path: Handsfree/Panel/PanelCopy.swift
      - path: Handsfree/Panel/PanelSnapshotBuilder.swift
      - path: Handsfree/Demo/PanelStateCatalogue.swift
    dependencies:
      - package: HFCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.handsfree.HandsfreeTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

schemes:
  Handsfree:
    build:
      targets:
        Handsfree: all
        HandsfreeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HandsfreeTests
    archive:
      config: Release
